# manifest ของระบบย่อย — CI และ conformance อ่านไฟล์นี้ไฟล์เดียว
# schema: standards/schemas/subsystem.schema.json

name: csmju-campus-activity-tracker          # ต้องตรงกับทะเบียนใน Core Hub และกับ data.service ของ /api/health
standards_version: "1.8.1"
conformance_level: L3                 # L1 · L2 · L3 (ระบบที่มี UI ต้องถึง L3)

base_url: http://localhost:3202       # Public web origin (also hosts the SSO callback)
core_hub_url: http://localhost:3000
callback_path: /auth/callback         # ต้องตรงกับ callback_url ที่ลงทะเบียนไว้

public_endpoints:
  - GET /api/health
  - GET /auth/callback

# conformance ใช้ probes ตรวจสัญญา API — ประกาศไม่ครบ = ขึ้น SKIP = ยังไม่ผ่าน
probes:
  collection: /api/v1/activities
  not_found: /api/v1/activities/99999999-9999-4999-8999-999999999999
  invalid_id: /api/v1/activities/not-a-uuid
  create:
    path: /api/v1/activities
    allowed_role: staff
    denied_role: student
    invalid_body:
      title: ""
    valid_body:
      title: "ทดสอบกิจกรรม"
      startsAt: "2026-12-01T09:00:00Z"
      endsAt: "2026-12-01T12:00:00Z"

owners:
  pl: "@csmju2030/pl-campus-activity-tracker"
  aie: "@csmju2030/aie-campus-activity-tracker"

display_name: "Campus Activity Tracker"
repo: github.com/CSMJU2030/csmju-campus-activity-tracker
status: proposed